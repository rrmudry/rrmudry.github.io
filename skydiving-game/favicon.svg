<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Canopy Gradient -->
    <linearGradient id="canopyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="canopyCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="canopyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <!-- Background Circle for contrast in any tab -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Disc Background with glowing border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Air Speed Streaks -->
  <path d="M12 28 C 12 36 14 44 14 50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" stroke-linecap="round" fill="none"/>
  <path d="M52 28 C 52 36 50 44 50 50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" stroke-linecap="round" fill="none"/>

  <!-- Parachute Canopy Segments -->
  <!-- Left Cell (Cyan) -->
  <path d="M12 24 C 12 12 22 10 24 24 C 20 25 15 25 12 24 Z" fill="url(#canopyCyan)"/>
  <!-- Center-Left Cell (Yellow) -->
  <path d="M24 24 C 23 10 32 8 32 24 C 28 25 25 25 24 24 Z" fill="url(#canopyYellow)"/>
  <!-- Center-Right Cell (Orange) -->
  <path d="M32 24 C 32 8 41 10 40 24 C 37 25 34 25 32 24 Z" fill="url(#canopyOrange)"/>
  <!-- Right Cell (Cyan) -->
  <path d="M40 24 C 42 10 52 12 52 24 C 49 25 44 25 40 24 Z" fill="url(#canopyCyan)"/>

  <!-- Parachute Suspension Lines -->
  <line x1="13" y1="24" x2="32" y2="44" stroke="#e2e8f0" stroke-width="1" opacity="0.85"/>
  <line x1="24" y1="24.5" x2="32" y2="44" stroke="#e2e8f0" stroke-width="1" opacity="0.85"/>
  <line x1="40" y1="24.5" x2="32" y2="44" stroke="#e2e8f0" stroke-width="1" opacity="0.85"/>
  <line x1="51" y1="24" x2="32" y2="44" stroke="#e2e8f0" stroke-width="1" opacity="0.85"/>

  <!-- Skydiver Body -->
  <!-- Helmet / Head -->
  <circle cx="32" cy="43" r="3.5" fill="#fde047" stroke="#0f172a" stroke-width="0.8"/>
  <!-- Jumpsuit (Torso) -->
  <path d="M29 46.5 C29 45 35 45 35 46.5 L34 52 L30 52 Z" fill="#f97316"/>
  <!-- Arms Holding Risers -->
  <path d="M29 47 L26 43" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M35 47 L38 43" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs / Flare -->
  <path d="M30.5 52 L28 56" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33.5 52 L36 56" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
</svg>
