<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --accent:#e8590c; --ok:#2b8a3e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em; display:flex; align-items:center; gap:10px; }
  h1 svg { width:40px; height:40px; flex:none; border-radius:10px; box-shadow:0 4px 12px rgba(232,89,12,.35); }
  h1 .ig { background:linear-gradient(100deg,#ffb020 0%,#ff6a13 45%,#e02d0f 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 .core { transform-origin:16px 27px; animation:flicker 2.4s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform:scale(1); } 40% { transform:scale(.9,1.08); } 70% { transform:scale(1.05,.94); } }
  @media (prefers-reduced-motion: reduce) { h1 .core { animation:none; } }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, select { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid #ccc; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:#b91c1c; border-color:#fecaca; background:#fff; }
  button.danger:hover { background:#fef2f2; }
  .card-actions { display:flex; gap:8px; align-items:center; }
  main { padding:0 20px 40px; display:grid; gap:12px; }
  .status { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card.printed { opacity:.5; }
  .who { flex:1 1 220px; }
  .who b { font-size:17px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#fff1e6; color:var(--accent); margin-right:6px; }
  .why { color:var(--muted); font-size:13px; margin-top:4px; }
  /* On-screen label preview: 29mm tall continuous strip, 2in (50.8mm) long */
  .label { width:192px; height:110px; border:1px dashed #bbb; background:#fff; display:flex; align-items:center; padding:6px 8px; gap:6px; overflow:hidden; }
  .label .star { font-size:28px; line-height:1; flex:none; }
  .label > div:last-child { min-width:0; }
  .label .t1 { font-weight:800; font-size:14px; line-height:1.1; }
  .label .t2 { font-size:11px; line-height:1.2; margin-top:2px; }
  .label .t3 { font-size:9px; color:#444; margin-top:2px; }
  details { background:#fff; border-radius:12px; padding:12px 16px; }
  textarea { width:100%; min-height:220px; font-family:ui-monospace,monospace; font-size:12px; }
  #printArea { display:none; }
  [hidden] { display:none !important; }
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate-card { background:var(--card); border-radius:16px; padding:32px 28px; max-width:420px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .gate-card h1 { justify-content:center; margin-bottom:10px; }
  .gate-card p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 20px; }
  .gate-err { color:#c92a2a; font-size:13px; font-weight:600; min-height:18px; margin-bottom:14px; }
  .user-pill { font-size:12px; color:var(--muted); background:#fff; border:1px solid #ddd; padding:6px 10px; border-radius:99px; }
  @media print {
    @page { size: 2in 29mm; margin: 0; }
    body { background:#fff; }
    header, main, details, #authGate { display:none !important; }
    #printArea { display:block; }
    #printArea .label { width:2in; height:29mm; border:none; padding:1.5mm 2mm; gap:1.5mm; }
    #printArea .star { font-size:8mm; }
    #printArea .t1 { font-size:3.8mm; }
    #printArea .t2 { font-size:2.9mm; margin-top:0.5mm; }
    #printArea .t3 { font-size:2.3mm; margin-top:0.5mm; }
  }

<body>

    <p id="gateMsg">Checking teacher authorization…</p>

<div id="appShell" hidden>
<header>
  <h1 aria-label="Rec-IGNITION"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc531"/><stop offset=".55" stop-color="#ff7a18"/><stop offset="1" stop-color="#e02d0f"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="#1d1d1f"/><g transform="translate(16 16) scale(.82) translate(-16 -15)"><path fill="url(#fl)" d="M17 2C17.5 7 24 10 24 18.5A8 8 0 0 1 8 18.5C8 15 9.5 12.5 11.5 10.5C11.8 13 12.8 14.2 14 14.8C13.2 10 14 5.5 17 2Z"/><path class="core" fill="#ffe9a8" d="M16 27a4.2 4.2 0 0 1-4.2-4.2c0-2.6 2.2-3.6 3.4-6.3c2.6 1.8 5 3.6 5 6.3A4.2 4.2 0 0 1 16 27Z"/></g></svg><span>Rec-<span class="ig">IGNITION</span></span></h1>
  <div class="bar">

<main>
  <div class="status" id="status">Using sample data.</div>

<details>
  <summary>Settings (Firebase project & field names)</summary>

  <textarea id="cfg"></textarea>
  <button id="saveCfg">Save settings</button>
</details>
</div>
<div id="printArea"></div>

<script type="module">
// ---------- Settings ----------
const DEFAULT_CFG = {
  firebase: {
    projectId: "site-6e500",
    appId: "1:591530758858:web:1996cdca7316ffc3781a33",
    storageBucket: "site-6e500.firebasestorage.app",
    apiKey: "AIzaSyAji2nTjD2dbmzgk8gySWCy-aiQyKvR1i4",
    authDomain: "site-6e500.firebaseapp.com",
    messagingSenderId: "591530758858"
  },
  // Who may open the tool is decided by the Firestore rules (admin-only list access), not by this page.
  // Collection group: student_results/{assignmentId}/students/{studentId}. practice_results docs are skipped.
  progressCollection: "students",
  resultsRoot: "student_results",
  lookbackDays: 30,
  // How often live mode checks for new saves. Each check reads only documents saved since the last one.
  pollSeconds: 60,
  // Scores are out of 10 (6 for the preparation steps + 4 for the mastery check).
  // Used when a record has no max-score field of its own, and for how scores are shown.
  defaultMaxScore: 10,
  fields: {
    studentId: "student_id", studentName: "student_name", classId: "class_period",
    score: "score", maxScore: "maxScore", quizHistory: "quiz_history", completed: "isCompleted",
    // The class apps don't agree on one save-time field, so all of these are read.
    timestamps: ["timestamp", "updated_at", "updatedAt", "submittedAt"]
  },
  thresholds: {
    classZ: 1.5,          // class standout: this many std devs above classmates who finished the same activity
    personalPrior: 4,     // personal best: needs at least this many earlier finished activities
    personalJumpPct: 15,  // personal best: at least this many percentage points above own average (15 = 1.5 out of 10)
    streakDays: 5,        // streak: consecutive school days with saved work
    improveRecent: 2,     // big improvement: average of the last N finished activities...
    improveBefore: 3,     // ...compared with the N before them
    improvePct: 20,       // big improvement: in percentage points (20 = 2 out of 10); also used for Mastery Check retakes
    persistAttempts: 3,   // persistence: this many Mastery Check attempts...
    persistScore: 80,     // ...ending at this percent or better
    speedZ: 1.2,          // speed of progress: std devs above classmates' pct/min pace
    speedMinPct: 60,      // speed of progress: minimum score % reached (~all prep done)
    speedMinMinutes: 3    // speed of progress: minimum minutes to avoid 1-minute spikes
  },
  // One label per student per day. When several triggers fire at once, the first one in this list wins.
  labelPriority: ["Personal best", "Big improvement", "Persistence", "Class standout", "Speed of progress", "Streak"],
  autoPrint: {
    maxPerHour: 8,        // safety cap so a data glitch can't empty the roll
    secondsBetween: 10,   // gap between labels in the queue
    schoolHours: [7, 16]  // only auto-print between 7:00 and 16:00
  }
};
let cfg = DEFAULT_CFG;
try {
  const saved = JSON.parse(localStorage.getItem("recig-cfg") || "{}");
  delete saved.allowedEmails; delete saved.allowedDomain; // older versions gated on these
  cfg = { ...DEFAULT_CFG, ...saved,
    fields: { ...DEFAULT_CFG.fields, ...(saved.fields || {}) },
    thresholds: { ...DEFAULT_CFG.thresholds, ...(saved.thresholds || {}) },
    autoPrint: { ...DEFAULT_CFG.autoPrint, ...(saved.autoPrint || {}) } };
  if (!cfg.firebase?.apiKey) cfg.firebase = DEFAULT_CFG.firebase;
  if (cfg.progressCollection === "progress") cfg.progressCollection = DEFAULT_CFG.progressCollection;
  if (!Array.isArray(cfg.fields.timestamps)) cfg.fields.timestamps = DEFAULT_CFG.fields.timestamps;
} catch {}
const $ = s => document.querySelector(s);
$("#cfg").value = JSON.stringify(cfg, null, 2);
$("#saveCfg").onclick = () => {
  try { cfg = JSON.parse($("#cfg").value); localStorage.setItem("recig-cfg", JSON.stringify(cfg)); alertStatus("Settings saved."); }
  catch (e) { alertStatus("Settings aren't valid JSON: " + e.message); }
};
const alertStatus = m => $("#status").textContent = m;
// Student names and activity names come from student-written documents: always insert them as text.
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
// Scores are kept internally as percentages; these show them on the real scale (e.g. 9/10).
const maxScore = () => Number(cfg.defaultMaxScore) || 10;
const pts = p => +(p * maxScore() / 100).toFixed(1);
const outOf = p => `${pts(p)}/${maxScore()}`;

let printed = {};
try { printed = JSON.parse(localStorage.getItem("recig-printed") || "{}"); } catch {}
const savePrinted = () => { try { localStorage.setItem("recig-printed", JSON.stringify(printed)); } catch {} };
let dismissed = {};
try { dismissed = JSON.parse(localStorage.getItem("recig-dismissed") || "{}"); } catch {}
const saveDismissed = () => { try { localStorage.setItem("recig-dismissed", JSON.stringify(dismissed)); } catch {} };

// Each class app keeps one document per student per assignment and overwrites it, so the
// document only knows its latest save time. Live mode remembers which days it has seen each
// student save, so streaks build up from the day the tool starts running.
let seenDays = {};
try { seenDays = JSON.parse(localStorage.getItem("recig-days") || "{}"); } catch {}
function rememberDays(recs) {
  const cutoff = Date.now() - cfg.lookbackDays * 864e5;
  for (const r of recs) {
    const list = seenDays[r.studentId] ||= [];
    const k = dayKey(r.t);
    if (r.t >= cutoff && !list.includes(k)) list.push(k);
  }
  for (const [sid, list] of Object.entries(seenDays)) {
    seenDays[sid] = list.filter(k => new Date(k).getTime() >= cutoff);
    if (!seenDays[sid].length) delete seenDays[sid];
  }
  try { localStorage.setItem("recig-days", JSON.stringify(seenDays)); } catch {}
}

// ---------- Sample data ----------
function demoRecords() {
  const names = ["Ava M.","Liam R.","Sofia G.","Noah T.","Mia L.","Ethan K.","Isabella P.","Lucas D.","Amelia W.","Mateo S.","Harper B.","Elijah C.","Camila V.","James H.","Luna F.","Benjamin O.","Aria N.","Daniel Q.","Zoe J.","Henry A."];
  const acts = ["Fractions Quest","Ratio Run","Equation Escape","Geometry Gym"];
  const recs = []; const now = Date.now(); const day = 864e5;
  names.forEach((n, i) => {
    const base = 55 + (i * 7) % 30;
    for (let d = 20; d >= 0; d--) {
      if (Math.random() < 0.35 && !(i === 2 && d < 7)) continue; // Sofia gets a streak
      const act = acts[(d + i) % acts.length];
      let s = base + (Math.random() * 16 - 8);
      if (i === 5 && d < 4) s += 28;          // Ethan: big improvement
      if (i === 9 && d === 0) s = 99;          // Mateo: stands out + personal best
      let quizHistory = [Math.round(s)];
      let minutes = 18 + Math.floor(Math.random() * 14);
      if (i === 7 && d === 0) { s = 75; minutes = 9; } // Lucas: speed of progress
      if (i === 14 && d === 0) { s = 88; quizHistory = [45, 60, 72, 90]; } // Luna: persistence
      // Whole-number score on the real scale, like the class apps save.
      const score = Math.max(0, Math.min(maxScore(), Math.round(s * maxScore() / 100)));
      recs.push({ path: `demo/${i}/${d}`, studentId: "s" + i, studentName: n, classId: "P3", activity: act,
        pct: Math.round(100 * score / maxScore()), settled: true, quizHistory, minutes, t: now - d * day - Math.random() * 3e7 });
    }
  });
  return recs;
}

// ---------- Firebase ----------
let fb = null;
async function loadFirebase() {
  if (fb) return fb;
  const v = "10.12.2";
  const app = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const auth = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  const a = app.getApps().length ? app.getApp() : app.initializeApp(cfg.firebase);
  fb = { auth, fs, authI: auth.getAuth(a), db: fs.getFirestore(a) };
  return fb;
}
// The Firestore rules only let admins list student results, so a one-document test read
// is the real authorization check.
async function hasTeacherAccess() {
  const { fs, db } = await loadFirebase();
  try {
    await fs.getDocs(fs.query(fs.collectionGroup(db, cfg.progressCollection), fs.limit(1)));
    return true;
  } catch (e) {
    if (e.code === "permission-denied") return false;
    throw e;
  }
}
$("#source").onchange = () => { $("#refresh").click(); };
async function signInTeacher() {
  try {
    $("#gateErr").textContent = "";
    const { auth, authI } = await loadFirebase();
    const p = new auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    await auth.signInWithPopup(authI, p);
  } catch (e) {
    if (e.code === "auth/popup-blocked") {
      const { auth, authI } = await loadFirebase();
      const p = new auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      await auth.signInWithRedirect(authI, p);
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      $("#gateErr").textContent = e.message;
    }
  }
}
$("#gateSignIn").onclick = signInTeacher;
$("#signout").onclick = async () => {
  stopLive();
  const { auth, authI } = await loadFirebase();
  await auth.signOut(authI);
};

// ---------- Live data ----------
const toMillis = ts => ts?.toMillis ? ts.toMillis() : (ts ? new Date(ts).getTime() : 0);
// Only student_results/{assignment}/students/{student}; the collection group also holds practice_results.
const isResultDoc = d => d.ref.parent.parent?.parent?.id === cfg.resultsRoot;
function toRecord(d) {
  const F = cfg.fields;
  const x = d.data();
  const t = Math.max(0, ...F.timestamps.map(f => toMillis(x[f])).filter(Number.isFinite));
  if (!t) return null;
  const rawScore = Number(x[F.score] ?? x.percentage ?? x.percent ?? 0);
  const max = Number(x[F.maxScore] ?? x.maxPoints) || maxScore();
  const pct = (rawScore > max && rawScore <= 100) ? Math.round(rawScore) : Math.round(100 * rawScore / max);
  const quizHistory = Array.isArray(x[F.quizHistory]) ? x[F.quizHistory].map(Number).filter(Number.isFinite) : [];
  const completed = x[F.completed];
  // "Finished" work: completed, or the Mastery Check has been taken. Apps that save neither field
  // only write when work is submitted, so their records count as finished.
  const settled = completed === true || quizHistory.length > 0 || (completed === undefined && !Array.isArray(x[F.quizHistory]));
  return {
    path: d.ref.path,
    studentId: String(x[F.studentId] ?? x.studentId ?? d.id),
    studentName: String(x[F.studentName] ?? x.studentName ?? x.displayName ?? "Student"),
    classId: x[F.classId] ?? x.period ?? "",
    activity: String(x.assignmentTitle ?? x.activityId ?? d.ref.parent.parent?.id ?? "Activity"),
    pct, settled, quizHistory, minutes: Number(x.minutes ?? x.timeMinutes ?? 0) || 0, t
  };
}
const liveDocs = new Map(); // document path -> record
let lastSeen = 0, pollTimer = null, polling = false;
// Time fields whose query failed (for example, an index still building). Retried on each check
// with the full lookback window until they work.
let skippedFields = [];
// One query per save-time field, merged by document path. Returns the fields that failed.
async function fetchSince(since, fields = cfg.fields.timestamps) {
  const { fs, db } = await loadFirebase();
  const problems = [];
  for (const field of fields) {
    try {
      const q = fs.query(fs.collectionGroup(db, cfg.progressCollection), fs.where(field, ">=", new Date(since)));
      const snap = await fs.getDocs(q);
      for (const d of snap.docs) {
        if (!isResultDoc(d)) continue;
        const r = toRecord(d);
        if (!r) continue;
        liveDocs.set(r.path, r);
        lastSeen = Math.max(lastSeen, r.t);
      }
    } catch (e) {
      problems.push({ field, why: e.code || e.message });
    }
  }
  return problems;
}
const skippedNote = () => skippedFields.length
  ? ` (Skipped ${skippedFields.map(p => `${p.field}: ${p.why}`).join(", ")}; retrying each check.)` : "";
function stopLive() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
async function startLive() {
  stopLive();
  liveDocs.clear(); lastSeen = 0;
  const lookback = () => Date.now() - cfg.lookbackDays * 864e5;
  skippedFields = await fetchSince(lookback());
  if (skippedFields.length === cfg.fields.timestamps.length) throw new Error(skippedFields.map(p => `${p.field}: ${p.why}`).join("; "));
  records = [...liveDocs.values()];
  rememberDays(records);
  const c = process(true);
  alertStatus(`Watching live: ${c.length} recognitions from ${records.length} records. Checking every ${cfg.pollSeconds} s.` + skippedNote());
  pollTimer = setInterval(async () => {
    if (polling) return; polling = true;
    try {
      // 1. Load the whole lookback window for any field whose query has started working (for
      //    example, an index finished building). Old records are treated like the first load,
      //    so they never trigger auto-print.
      let recovered = false;
      const retry = skippedFields.map(p => p.field);
      if (retry.length) {
        skippedFields = await fetchSince(lookback(), retry);
        recovered = skippedFields.length < retry.length;
        if (recovered) { records = [...liveDocs.values()]; rememberDays(records); process(true); }
      }
      // 2. Read only what was saved since the last check, on the fields that work.
      const before = lastSeen, countBefore = liveDocs.size;
      const working = cfg.fields.timestamps.filter(f => !skippedFields.some(p => p.field === f));
      await fetchSince(before || Date.now(), working);
      if (lastSeen !== before || liveDocs.size !== countBefore || recovered) {
        records = [...liveDocs.values()];
        rememberDays(records);
        const c = process(false);
        if (!$("#auto").checked || recovered) alertStatus(`Watching live: ${c.length} recognitions from ${records.length} records.` + skippedNote());
      }
    } catch (e) {
      alertStatus("Live connection problem: " + e.message);
    } finally { polling = false; }
  }, Math.max(15, Number(cfg.pollSeconds) || 60) * 1000);
}

// ---------- Detection ----------
const mean = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const dayKey = t => new Date(t).toDateString();
const first = n => String(n).split(" ")[0];
// School days are Monday to Friday, so a weekend never breaks a streak or makes Friday's work "old".
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isSchoolDay = t => { const w = new Date(t).getDay(); return w !== 0 && w !== 6; };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
// Number of school days after day a, up to and including day b.
function schoolDaysBetween(a, b) {
  let n = 0;
  for (let d = addDays(startOfDay(a), 1); d <= startOfDay(b); d = addDays(d, 1)) if (isSchoolDay(d)) n++;
  return n;
}
// Start of the Nth most recent school day, counting today if it is one.
function schoolDaysBack(n) {
  let d = startOfDay(Date.now()), cut = d, count = 0;
  for (let i = 0; i < 30 && count < n; i++, d = addDays(d, -1)) if (isSchoolDay(d)) { count++; cut = d; }
  return cut;
}

function detect(recs) {
  const T = cfg.thresholds; const out = [];
  // "Recent" means the last 2 school days, so Monday still sees Friday's work.
  const recentCut = schoolDaysBack(2);
  const live = $("#source").value === "live";
  const byStudent = {}; recs.forEach(r => (byStudent[r.studentId] ||= []).push(r));
  // Class comparisons use finished work only, so a classmate who is halfway through doesn't drag the average down.
  const byAct = {}; recs.filter(r => r.settled).forEach(r => (byAct[r.activity] ||= []).push(r.pct));
  // Speed comparisons use any classmate with enough time & progress on the same activity.
  const minMins = T.speedMinMinutes ?? 3, minPct = T.speedMinPct ?? 60, speedZ = T.speedZ ?? 1.2;
  const speedByAct = {};
  recs.filter(r => r.minutes >= minMins && r.pct >= 25).forEach(r => (speedByAct[r.activity] ||= []).push(r.pct / r.minutes));

  for (const [sid, rs] of Object.entries(byStudent)) {
    rs.sort((a, b) => a.t - b.t);
    const name = rs[rs.length - 1].studentName;
    const done = rs.filter(r => r.settled);
    const latest = done[done.length - 1];
    const recent = done.filter(r => r.t >= recentCut);
    const add = (type, line, detail, key) => out.push({ sid, name, type, line, detail, key: sid + "|" + type + "|" + key });

    // Class standout
    for (const r of recent) {
      const pool = byAct[r.activity]; if (pool.length < 5) continue;
      const z = (r.pct - mean(pool)) / (sd(pool) || 1);
      if (z >= T.classZ) { add("Class standout", `Shining star in ${r.activity}!`, `${outOf(r.pct)} vs finished-class avg ${outOf(mean(pool))}`, r.activity); break; }
    }
    // Personal best
    if (latest && latest.t >= recentCut) {
      const prior = done.filter(r => r !== latest).map(r => r.pct);
      if (prior.length >= T.personalPrior && latest.pct > Math.max(...prior) && latest.pct - mean(prior) >= T.personalJumpPct)
        add("Personal best", `New personal best in ${latest.activity}!`, `${outOf(latest.pct)} (your avg ${outOf(mean(prior))})`, latest.activity);
    }
    // Streak: any saved work counts, finished or not
    const dayset = new Set(rs.map(r => dayKey(r.t)));
    if (live) (seenDays[sid] || []).forEach(k => dayset.add(k));
    const days = [...dayset].map(d => new Date(d).getTime()).sort((a, b) => b - a);
    let streak = 0, cursor = startOfDay(Date.now());
    for (const d of days) { if (schoolDaysBetween(d, cursor) <= 1) { streak++; cursor = d; } else break; }
    if (streak >= T.streakDays) add("Streak", `${streak}-day learning streak!`, `Worked ${streak} days in a row`, "streak" + Math.floor(streak / T.streakDays));
    // Big improvement: across finished activities, or across Mastery Check retakes on one activity
    const nR = T.improveRecent, nB = T.improveBefore;
    let improved = false;
    if (latest && latest.t >= recentCut && done.length >= nR + nB) {
      const a = mean(done.slice(-nR).map(r => r.pct)), b = mean(done.slice(-(nR + nB), -nR).map(r => r.pct));
      if (a - b >= T.improvePct) { add("Big improvement", `Huge leap forward — up ${pts(a - b)} points!`, `Recent avg ${outOf(a)} vs ${outOf(b)} before`, latest.activity); improved = true; }
    }
    if (!improved) {
      const r = recent.find(r => r.quizHistory.length >= 2 && r.quizHistory[r.quizHistory.length - 1] - r.quizHistory[0] >= T.improvePct);
      if (r) { const q = r.quizHistory; add("Big improvement", `Huge leap on the ${r.activity} Mastery Check!`, `Mastery Check ${q[0]}% → ${q[q.length - 1]}%`, r.activity + "|quiz"); }
    }
    // Persistence: several Mastery Check attempts, ending strong
    const p = recent.find(r => r.quizHistory.length >= T.persistAttempts && r.quizHistory[r.quizHistory.length - 1] >= T.persistScore);
    if (p) add("Persistence", `Never gave up on ${p.activity}!`, `${p.quizHistory.length} Mastery Check tries → ${p.quizHistory[p.quizHistory.length - 1]}%`, p.activity);
    // Speed of progress: strong points-per-minute pace vs classmates on the same activity (works before finishing)
    for (const r of rs.filter(r => r.t >= recentCut && r.pct >= minPct && r.minutes >= minMins)) {
      const pool = speedByAct[r.activity]; if (!pool || pool.length < 5) continue;
      const rate = r.pct / r.minutes, z = (rate - mean(pool)) / (sd(pool) || 1);
      if (z >= speedZ) { add("Speed of progress", `Cruising through ${r.activity}!`, `${outOf(r.pct)} in ${Math.round(r.minutes)} min (${Math.round(rate)}%/min vs avg ${Math.round(mean(pool))}%/min)`, r.activity); break; }
    }
  }
  return out;
}

// ---------- UI + printing ----------
const STARS = { "Class standout":"🌟", "Personal best":"🏆", "Streak":"🔥", "Big improvement":"🚀", "Persistence":"💪", "Speed of progress":"⚡" };
const labelHTML = c => `<div class="label"><div class="star">${STARS[c.type] || "⭐"}</div><div>
  <div class="t1">Way to go, ${esc(first(c.name))}!</div><div class="t2">${esc(c.line)}</div>
  <div class="t3">${new Date().toLocaleDateString()}</div></div></div>`;

// ---------- Auto-print ----------
let records = [], knownKeys = new Set(), lastCands = [];
const queue = []; let printing = false; const printLog = [];
function printLabel(c) {
  $("#printArea").innerHTML = labelHTML(c); window.print();
  printed[c.key] = Date.now(); printed["day|" + c.sid] = Date.now(); savePrinted();
}
const isToday = t => !!t && dayKey(t) === dayKey(Date.now());
const gotLabelToday = sid => isToday(printed["day|" + sid]);
// Keep one recognition per student: the one printed today if there is one,
// otherwise the highest-priority one that hasn't been printed yet.
function onePerStudent(cands) {
  const order = cfg.labelPriority || DEFAULT_CFG.labelPriority;
  const rank = c => { const i = order.indexOf(c.type); return i < 0 ? order.length : i; };
  const score = c => (isToday(printed[c.key]) ? 0 : printed[c.key] ? 200 : 100) + rank(c);
  const best = new Map();
  for (const c of cands) { const b = best.get(c.sid); if (!b || score(c) < score(b)) best.set(c.sid, c); }
  return [...best.values()];
}
function inSchoolHours() { const h = new Date().getHours(), [a, b] = (cfg.autoPrint || DEFAULT_CFG.autoPrint).schoolHours; return h >= a && h < b; }
async function drainQueue() {
  if (printing) return; printing = true;
  const A = cfg.autoPrint || DEFAULT_CFG.autoPrint;
  while (queue.length) {
    const hourAgo = Date.now() - 36e5;
    while (printLog.length && printLog[0] < hourAgo) printLog.shift();
    if (printLog.length >= A.maxPerHour) { alertStatus(`Hourly cap reached (${A.maxPerHour}). ${queue.length} waiting — print them by hand below.`); break; }
    const c = queue.shift();
    if (!dismissed[c.key] && !printed[c.key] && !gotLabelToday(c.sid)) { printLabel(c); printLog.push(Date.now()); render(lastCands); alertStatus(`Auto-printed: ${c.name} — ${c.type}`); }
    await new Promise(r => setTimeout(r, A.secondsBetween * 1000));
  }
  printing = false;
}
// Re-run detection; anything not seen before is "new". First pass only records what exists (no burst on start-up).
function process(firstPass) {
  const all = detect(records).filter(c => !dismissed[c.key]);
  const cands = onePerStudent(all).sort((a, b) => !!printed[a.key] - !!printed[b.key]);
  const fresh = cands.filter(c => !knownKeys.has(c.key));
  all.forEach(c => knownKeys.add(c.key));
  lastCands = cands; render(cands);
  if (!firstPass && $("#auto").checked && inSchoolHours()) {
    fresh.filter(c => !printed[c.key] && !gotLabelToday(c.sid)).forEach(c => queue.push(c)); drainQueue();
  }
  return cands;
}
$("#simulate").onclick = () => {
  if ($("#source").value !== "demo") return alertStatus("Simulate only works with sample data.");
  const s = records[Math.floor(Math.random() * records.length)];
  records.push({ ...s, path: s.path + "|sim" + Date.now(), pct: 100, settled: true, quizHistory: [50, 70, 100], t: Date.now() });
  process(false);
};

function render(cands) {
  $("#list").innerHTML = cands.length ? "" : `<p class="status">No stand-outs right now. Check back after the next activity!</p>`;
  cands.forEach(c => {
    const el = document.createElement("div"); el.className = "card" + (printed[c.key] ? " printed" : "");
    el.innerHTML = `<div class="who"><span class="tag">${esc(c.type)}</span><b>${esc(c.name)}</b><div class="why">${esc(c.detail)}</div></div>${labelHTML(c)}<div class="card-actions"><button class="primary" data-act="print">${printed[c.key] ? "Print again" : "Print label"}</button><button class="danger" data-act="delete" title="Remove this sticker">Delete</button></div>`;
    el.querySelector('[data-act="print"]').onclick = () => {
      printLabel(c); el.classList.add("printed"); el.querySelector('[data-act="print"]').textContent = "Print again";
    };
    el.querySelector('[data-act="delete"]').onclick = () => {
      dismissed[c.key] = Date.now(); saveDismissed();
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].key === c.key) queue.splice(i, 1);
      process(true);
    };
    $("#list").appendChild(el);
  });
}
$("#refresh").onclick = async () => {
  try {
    alertStatus("Looking for stand-outs…"); knownKeys = new Set();
    if ($("#source").value === "live") return await startLive();
    stopLive();
    records = demoRecords();
    const c = process(true);
    alertStatus(`${c.length} recognition${c.length === 1 ? "" : "s"} found from ${records.length} activity records.`);
  } catch (e) { alertStatus("Couldn't load data: " + e.message); }
};
function showGate(msg, err, buttonText) {
  stopLive();
  $("#appShell").hidden = true;
  $("#authGate").hidden = false;
  $("#gateMsg").textContent = msg;
  $("#gateErr").textContent = err || "";
  $("#gateSignIn").textContent = buttonText;
  $("#gateSignIn").hidden = false;
}
async function initAuth() {
  const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
  if (isLocal && new URLSearchParams(location.search).has("demo")) {
    $("#authGate").hidden = true;
    $("#appShell").hidden = false;
    $("#refresh").click();
    return;
  }
  try {
    const { auth, authI } = await loadFirebase();
    auth.onAuthStateChanged(authI, async user => {
      if (!user) return showGate("Sign in with your teacher Google account to open Rec-IGNITION.", "", "Sign in with Google");
      $("#gateMsg").textContent = "Checking teacher access…";
      $("#gateSignIn").hidden = true;
      let ok = false;
      try { ok = await hasTeacherAccess(); }
      catch (e) { return showGate("Couldn't check access to class data.", e.message, "Try again"); }
      if (!ok) return showGate(`Signed in as ${user.email}, which is not authorized for this tool.`, "Teacher account required.", "Switch Google account");
      $("#authGate").hidden = true;
      $("#appShell").hidden = false;
      $("#userBadge").textContent = user.email;
      $("#userBadge").hidden = false;
      $("#signout").hidden = false;
      $("#refresh").click();
    });
  } catch (e) {
    $("#gateMsg").textContent = "Authentication could not initialize.";
    $("#gateErr").textContent = e.message;
    $("#gateSignIn").hidden = false;
  }
}
initAuth();
</script>
