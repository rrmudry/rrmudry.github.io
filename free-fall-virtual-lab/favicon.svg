<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Dark Disc Background with glowing border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Motion Speed Streaks -->
  <line x1="19" y1="12" x2="19" y2="20" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="45" y1="12" x2="45" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Left: Orange Bowling Ball -->
  <circle cx="19" cy="34" r="10" fill="url(#ballGrad)"/>
  <!-- Finger Holes -->
  <circle cx="17" cy="31" r="1.2" fill="#7c2d12"/>
  <circle cx="21" cy="31" r="1.2" fill="#7c2d12"/>
  <circle cx="19" cy="35" r="1.2" fill="#7c2d12"/>

  <!-- Right: Cyan Feather -->
  <path d="M45 22 C51 25 54 32 52 41 C49 45 44 46 42 46 C42 42 44 37 42 32 C40 28 39 25 45 22 Z" fill="url(#featherGrad)"/>
  <!-- Feather Quill / Shaft -->
  <path d="M45 22 Q42 34 40 47" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" fill="none"/>

  <!-- Downward Gravitational Force Arrow (g = 10) in Center -->
  <path d="M32 16 L32 46 M28 41 L32 46 L36 41" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
