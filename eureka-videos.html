<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('color-scheme');
        if (saved === 'light' || saved === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch (e) { }
    })();
  </script>
  <meta name="description"
    content="Browse all 30 animated Eureka! physics episodes with an interactive theater player, topic filters, and searchable episode guide." />
  <title>Eureka! Physics Videos • Mr. Mudry’s Physics</title>
  <link rel="icon" type="image/png" href="head.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <link rel="stylesheet" href="assets/theme.css" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Eureka! Physics Videos • Mr. Mudry’s Physics" />
  <meta property="og:description"
    content="Classic animated explanations of core physics concepts—watch in theater mode or filter by unit." />
  <meta property="og:image" content="https://rrmudry.github.io/head.png" />
  <meta property="og:url" content="https://rrmudry.github.io/eureka-videos.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      color-scheme: dark;

      /* Light / Dark adaptive design tokens */
      --ev-bg: light-dark(#f1f5f9, #070b18);
      --ev-bg-radial-1: light-dark(rgba(234, 88, 12, 0.08), rgba(249, 115, 22, 0.16));
      --ev-bg-radial-2: light-dark(rgba(2, 132, 199, 0.08), rgba(56, 189, 248, 0.14));
      --ev-surface: light-dark(#ffffff, rgba(15, 23, 42, 0.88));
      --ev-surface-2: light-dark(#f8fafc, rgba(30, 41, 59, 0.72));
      --ev-header-bg: light-dark(rgba(255, 255, 255, 0.96), rgba(5, 10, 24, 0.94));
      --ev-ink: light-dark(#0f172a, #f8fafc);
      --ev-ink-muted: light-dark(#334155, #cbd5e1);
      --ev-ink-dim: light-dark(#475569, #94a3b8);
      --ev-border: light-dark(#cbd5e1, rgba(148, 163, 184, 0.22));
      --ev-border-strong: light-dark(#0284c7, #38bdf8);
      --ev-accent: light-dark(#ea580c, #fb923c);
      --ev-accent-strong: light-dark(#c2410c, #f97316);
      --ev-accent-ink: light-dark(#ffffff, #090d16);
      --ev-cyan: light-dark(#0284c7, #38bdf8);
      --ev-emerald: light-dark(#059669, #34d399);
      --ev-shadow: light-dark(0 10px 30px rgba(15, 23, 42, 0.08), 0 20px 50px rgba(2, 6, 23, 0.55));
      --ev-card-shadow: light-dark(0 4px 14px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(2, 6, 23, 0.42));
      --ev-focus: light-dark(#0284c7, #38bdf8);
      --ev-maxw: 1180px;
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) {
      color-scheme: dark;
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) {
      color-scheme: light;
    }

    /* Fallback for browsers without light-dark() */
    @supports not (color: light-dark(white, black)) {
      :root {
        --ev-bg: #070b18;
        --ev-surface: rgba(15, 23, 42, 0.88);
        --ev-surface-2: rgba(30, 41, 59, 0.72);
        --ev-header-bg: rgba(5, 10, 24, 0.94);
        --ev-ink: #f8fafc;
        --ev-ink-muted: #cbd5e1;
        --ev-ink-dim: #94a3b8;
        --ev-border: rgba(148, 163, 184, 0.22);
        --ev-border-strong: #38bdf8;
        --ev-accent: #fb923c;
        --ev-accent-strong: #f97316;
        --ev-accent-ink: #090d16;
        --ev-cyan: #38bdf8;
        --ev-emerald: #34d399;
        --ev-shadow: 0 20px 50px rgba(2, 6, 23, 0.55);
        --ev-card-shadow: 0 12px 28px rgba(2, 6, 23, 0.42);
        --ev-focus: #38bdf8;
      }

      :root:has(> head > meta[name="color-scheme"][content="light"]) {
        --ev-bg: #f1f5f9;
        --ev-surface: #ffffff;
        --ev-surface-2: #f8fafc;
        --ev-header-bg: rgba(255, 255, 255, 0.96);
        --ev-ink: #0f172a;
        --ev-ink-muted: #334155;
        --ev-ink-dim: #475569;
        --ev-border: #cbd5e1;
        --ev-border-strong: #0284c7;
        --ev-accent: #ea580c;
        --ev-accent-strong: #c2410c;
        --ev-accent-ink: #ffffff;
        --ev-cyan: #0284c7;
        --ev-emerald: #059669;
        --ev-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        --ev-card-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        --ev-focus: #0284c7;
      }
    }

    body {
      background-color: var(--ev-bg);
      background-image:
        radial-gradient(circle at 12% 8%, var(--ev-bg-radial-1), transparent 46%),
        radial-gradient(circle at 88% 18%, var(--ev-bg-radial-2), transparent 44%);
      color: var(--ev-ink);
      min-block-size: 100dvb;
    }

    /* Tone down background sketch in light mode so contrast stays crisp */
    :root:has(> head > meta[name="color-scheme"][content="light"]) body::before {
      opacity: 0.07;
    }

    /* Adapt shared header & footer partials to current scheme */
    .site-header {
      background: var(--ev-header-bg);
      border-bottom-color: var(--ev-border);
      z-index: 30;
    }

    .brand,
    .menu a[aria-current="page"],
    .menu a:hover,
    .menu a:focus {
      color: var(--ev-ink);
    }

    .menu a {
      color: var(--ev-ink-muted);
    }

    .site-footer {
      color: var(--ev-ink-dim);
      border-top: 1px solid var(--ev-border);
    }

    .site-footer a {
      color: var(--ev-cyan);
    }

    /* Focus rings */
    :where(a:any-link, button, input):focus-visible {
      outline: 3px solid var(--ev-focus);
      outline-offset: 3px;
    }

    .ev-main {
      inline-size: min(var(--ev-maxw), 94vw);
      margin-inline: auto;
      padding-block: 1.75rem 3.5rem;
      display: grid;
      gap: 2rem;
    }

    /* Compact Hero Header */
    .ev-hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.25rem;
      padding: 1.5rem 1.75rem;
      background: var(--ev-surface);
      border: 1px solid var(--ev-border);
      border-radius: 20px;
      box-shadow: var(--ev-card-shadow);
    }

    .ev-hero-copy {
      display: grid;
      gap: 0.45rem;
      max-inline-size: 62ch;
    }

    .ev-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      inline-size: fit-content;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ev-accent);
      background: color-mix(in srgb, var(--ev-accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--ev-accent) 35%, transparent);
    }

    .ev-hero h1 {
      margin: 0;
      font-size: clamp(1.85rem, 1.3rem + 2vw, 2.75rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.01em;
      color: var(--ev-ink);
    }

    .ev-hero p {
      margin: 0;
      color: var(--ev-ink-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .ev-hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
    }

    /* Buttons */
    .ev-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-block-size: 42px;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--ev-border);
      background: var(--ev-surface-2);
      color: var(--ev-ink);
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ev-btn:hover {
      transform: translateY(-1px);
      border-color: var(--ev-border-strong);
      color: var(--ev-ink);
    }

    .ev-btn-primary {
      background: linear-gradient(135deg, var(--ev-accent) 0%, var(--ev-accent-strong) 100%);
      color: var(--ev-accent-ink);
      border-color: transparent;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--ev-accent) 30%, transparent);
    }

    .ev-btn-primary:hover {
      color: var(--ev-accent-ink);
      filter: brightness(1.06);
      border-color: transparent;
    }

    .ev-btn[disabled],
    .ev-btn[aria-disabled="true"] {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Theme toggle icon branching without JS class dependency */
    .ev-theme-icon-light {
      display: inline;
    }

    .ev-theme-icon-dark {
      display: none;
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) .ev-theme-icon-light {
      display: none;
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) .ev-theme-icon-dark {
      display: inline;
    }

    /* Theater Section */
    .ev-theater {
      background: var(--ev-surface);
      border: 1px solid var(--ev-border);
      border-radius: 22px;
      padding: 1rem;
      box-shadow: var(--ev-shadow);
      display: grid;
      gap: 1rem;
    }

    .ev-player-frame {
      position: relative;
      inline-size: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      border: 1px solid var(--ev-border);
    }

    .ev-player-frame>#player,
    .ev-player-frame iframe {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      border: 0;
      display: block;
    }

    .ev-now-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem 1.25rem;
      padding: 0.35rem 0.4rem 0.2rem;
    }

    .ev-now-info {
      display: grid;
      gap: 0.2rem;
      min-inline-size: 0;
      flex: 1 1 280px;
    }

    .ev-now-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ev-cyan);
    }

    .ev-live-dot {
      inline-size: 8px;
      block-size: 8px;
      border-radius: 50%;
      background: var(--ev-accent);
      box-shadow: 0 0 10px var(--ev-accent);
    }

    .ev-now-title {
      margin: 0;
      font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.35rem);
      font-weight: 800;
      color: var(--ev-ink);
      line-height: 1.25;
    }

    .ev-now-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    /* Controls & Filter Toolbar */
    .ev-controls-section {
      display: grid;
      gap: 1.25rem;
    }

    .ev-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem 1.25rem;
      padding: 1rem 1.15rem;
      background: var(--ev-surface);
      border: 1px solid var(--ev-border);
      border-radius: 16px;
      box-shadow: var(--ev-card-shadow);
    }

    .ev-search-wrap {
      position: relative;
      flex: 1 1 260px;
      max-inline-size: 420px;
      display: flex;
      align-items: center;
    }

    .ev-search-icon {
      position: absolute;
      inset-inline-start: 0.85rem;
      color: var(--ev-ink-dim);
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    .ev-search-input {
      inline-size: 100%;
      min-block-size: 42px;
      padding: 0.55rem 0.9rem 0.55rem 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--ev-border);
      background: var(--ev-surface-2);
      color: var(--ev-ink);
      font: inherit;
      font-size: 0.95rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ev-search-input::placeholder {
      color: var(--ev-ink-dim);
    }

    .ev-search-input:focus {
      outline: none;
      border-color: var(--ev-border-strong);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ev-border-strong) 22%, transparent);
    }

    .ev-filter-row {
      display: flex;
      flex-wrap: wrap;
      flex-wrap: balance;
      align-items: center;
      gap: 0.45rem;
    }

    .ev-pill {
      min-block-size: 38px;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--ev-border);
      background: var(--ev-surface-2);
      color: var(--ev-ink-muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .ev-pill:hover {
      border-color: var(--ev-border-strong);
      color: var(--ev-ink);
    }

    .ev-pill[aria-pressed="true"] {
      background: var(--ev-cyan);
      color: var(--ev-accent-ink);
      border-color: transparent;
    }

    .ev-status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-inline: 0.2rem;
    }

    .ev-section-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ev-ink);
    }

    .ev-count {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ev-ink-dim);
    }

    /* Responsive Episode Grid with Subgrid Card Alignment */
    .ev-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 1.15rem;
    }

    .ev-card {
      background: var(--ev-surface);
      border: 1px solid var(--ev-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--ev-card-shadow);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .ev-card:hover {
      transform: translateY(-3px);
      border-color: var(--ev-border-strong);
    }

    .ev-card[data-active="true"] {
      border: 2px solid var(--ev-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ev-accent) 22%, transparent), var(--ev-card-shadow);
    }

    .ev-thumb-btn {
      position: relative;
      display: block;
      inline-size: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      border: 0;
      background: #0f172a;
      cursor: pointer;
      overflow: hidden;
    }

    .ev-thumb-img {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.28s ease;
    }

    .ev-card:hover .ev-thumb-img {
      transform: scale(1.04);
    }

    .ev-thumb-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.45) 0%, rgba(2, 6, 23, 0.05) 45%, rgba(2, 6, 23, 0.55) 100%);
      pointer-events: none;
    }

    .ev-ep-badge {
      position: absolute;
      inset-block-start: 0.6rem;
      inset-inline-start: 0.6rem;
      padding: 0.2rem 0.55rem;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.86);
      color: #f8fafc;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .ev-watched-badge {
      position: absolute;
      inset-block-start: 0.6rem;
      inset-inline-end: 0.6rem;
      padding: 0.2rem 0.55rem;
      border-radius: 8px;
      background: rgba(5, 150, 105, 0.92);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      pointer-events: none;
    }

    .ev-play-badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .ev-play-circle {
      inline-size: 52px;
      block-size: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .ev-thumb-btn:hover .ev-play-circle,
    .ev-card[data-active="true"] .ev-play-circle {
      transform: scale(1.08);
      background: var(--ev-accent);
      border-color: var(--ev-accent);
      color: var(--ev-accent-ink);
    }

    .ev-card-tags {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.8rem 1rem 0;
    }

    .ev-topic-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ev-cyan);
    }

    .ev-playing-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ev-accent);
    }

    .ev-card-title {
      margin: 0;
      padding: 0.35rem 1rem 0.6rem;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ev-ink);
    }

    .ev-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 1rem 0.9rem;
      border-top: 1px solid color-mix(in srgb, var(--ev-border) 55%, transparent);
    }

    .ev-watch-link {
      background: none;
      border: 0;
      padding: 0.25rem 0;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ev-accent);
      cursor: pointer;
    }

    .ev-watch-link:hover {
      text-decoration: underline;
    }

    .ev-yt-link {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ev-ink-dim);
      text-decoration: none;
      padding: 0.25rem 0.45rem;
      border-radius: 8px;
    }

    .ev-yt-link:hover {
      color: var(--ev-cyan);
      text-decoration: underline;
    }

    /* Loading Skeletons & Empty/Error States */
    .ev-skeleton {
      background: var(--ev-surface);
      border: 1px solid var(--ev-border);
      border-radius: 16px;
      overflow: hidden;
      padding-block-end: 1rem;
    }

    .ev-skeleton-thumb {
      inline-size: 100%;
      aspect-ratio: 16 / 9;
      background: color-mix(in srgb, var(--ev-ink-dim) 18%, transparent);
    }

    .ev-skeleton-line {
      block-size: 14px;
      margin: 0.85rem 1rem 0;
      border-radius: 6px;
      background: color-mix(in srgb, var(--ev-ink-dim) 18%, transparent);
    }

    .ev-skeleton-line.short {
      inline-size: 55%;
      margin-block-start: 0.5rem;
    }

    .ev-empty {
      grid-column: 1 / -1;
      padding: 2.25rem 1.5rem;
      text-align: center;
      background: var(--ev-surface);
      border: 1px dashed var(--ev-border);
      border-radius: 16px;
      color: var(--ev-ink-muted);
      display: grid;
      gap: 0.75rem;
      justify-items: center;
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    @media (prefers-reduced-motion: reduce) {

      .ev-btn,
      .ev-card,
      .ev-thumb-img,
      .ev-play-circle {
        transition: none;
      }

      .ev-card:hover,
      .ev-btn:hover,
      .ev-card:hover .ev-thumb-img {
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .ev-hero {
        padding: 1.15rem;
      }

      .ev-theater {
        padding: 0.65rem;
        border-radius: 16px;
      }

      .ev-toolbar {
        padding: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <div data-include="header"></div>

  <main role="main" class="ev-main">
    <section class="ev-hero" aria-labelledby="page-title">
      <div class="ev-hero-copy">
        <span class="ev-eyebrow">30-Episode Physics Series</span>
        <h1 id="page-title">Eureka! Physics Videos</h1>
        <p>Animated, crystal-clear explanations of inertia, force, energy, and heat. Pick an episode below to load it in
          the theater player.</p>
      </div>
      <div class="ev-hero-actions">
        <button id="btn-theme-toggle" class="ev-btn" type="button" aria-label="Switch light or dark theme">
          <span class="ev-theme-icon-light" aria-hidden="true">☀️ Light Mode</span>
          <span class="ev-theme-icon-dark" aria-hidden="true">🌙 Dark Mode</span>
        </button>
        <a id="openOnYT" class="ev-btn ev-btn-primary"
          href="https://www.youtube.com/playlist?list=PLjFc2AYbYsNmjqtm-wlVXpgFaDvpPCMHx" target="_blank"
          rel="noopener">
          Open Playlist on YouTube ↗
        </a>
      </div>
    </section>

    <section class="ev-theater" aria-label="Video Theater">
      <div class="ev-player-frame">
        <div id="player" aria-label="YouTube playlist player"></div>
      </div>
      <div class="ev-now-bar">
        <div class="ev-now-info">
          <span class="ev-now-kicker"><span class="ev-live-dot" aria-hidden="true"></span> Now Playing</span>
          <h2 id="now-playing-title" class="ev-now-title">Loading Eureka! Playlist…</h2>
        </div>
        <div class="ev-now-controls">
          <button id="btn-prev" class="ev-btn" type="button" disabled>◀ Prev</button>
          <button id="btn-next" class="ev-btn" type="button" disabled>Next ▶</button>
        </div>
      </div>
    </section>

    <section class="ev-controls-section" aria-labelledby="episode-library-heading">
      <div class="ev-toolbar">
        <div class="ev-search-wrap">
          <label for="q" class="visually-hidden">Search episodes by title or physics topic</label>
          <span class="ev-search-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input id="q" class="ev-search-input" type="search"
            placeholder="Search episodes… (e.g., inertia, pulley, heat)" />
        </div>

        <div class="ev-filter-row" role="group" aria-label="Filter episodes by physics topic">
          <button class="ev-pill" type="button" data-topic="all" aria-pressed="true">All Episodes</button>
          <button class="ev-pill" type="button" data-topic="motion" aria-pressed="false">Motion &amp; Forces</button>
          <button class="ev-pill" type="button" data-topic="energy" aria-pressed="false">Work &amp; Energy</button>
          <button class="ev-pill" type="button" data-topic="heat" aria-pressed="false">Heat &amp; Matter</button>
        </div>
      </div>

      <div class="ev-status-bar">
        <h2 id="episode-library-heading" class="ev-section-title">Episode Library</h2>
        <p id="result-count" class="ev-count" aria-live="polite">Loading episodes…</p>
      </div>

      <div id="grid" class="ev-grid"></div>
    </section>
  </main>

  <div data-include="footer"></div>
  <script src="assets/partials.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PLAYLIST_ID = "PLjFc2AYbYsNmjqtm-wlVXpgFaDvpPCMHx";
    const PLAYLIST_URL = `https://www.youtube.com/playlist?list=${PLAYLIST_ID}`;
    const WATCHED_STORAGE_KEY = "eureka_watched_ids_v1";

    let player = null;
    let items = [];
    let currentId = null;
    let activeTopic = "all";
    let searchTerm = "";
    let loadTimeout = null;

    const thumb = (id) => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    const watchUrl = (id) => `https://www.youtube.com/watch?v=${id}&list=${PLAYLIST_ID}`;

    function getWatchedSet() {
      try {
        const raw = localStorage.getItem(WATCHED_STORAGE_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function markWatched(id) {
      if (!id) return;
      try {
        const set = getWatchedSet();
        set.add(id);
        localStorage.setItem(WATCHED_STORAGE_KEY, JSON.stringify([...set]));
      } catch { }
    }

    function classifyTopic(title) {
      const t = (title || "").toLowerCase();
      if (/inertia|mass|speed|accel|gravity|weight|force|momentum|vector|motion|newton/.test(t)) {
        return { key: "motion", label: "Motion & Forces" };
      }
      if (/work|energy|kinetic|potential|machine|lever|pulley|inclined|screw|wedge|wheel|power/.test(t)) {
        return { key: "energy", label: "Work & Energy" };
      }
      if (/heat|temp|molecule|expan|contract|conduc|convec|radia|evap|condens|melt|boil|freez|state|thermal|calor/.test(t)) {
        return { key: "heat", label: "Heat & Matter" };
      }
      return { key: "motion", label: "Physics Core" };
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderSkeletons(count = 8) {
      const grid = document.getElementById("grid");
      grid.innerHTML = Array.from({ length: count }, () => `
        <div class="ev-skeleton" aria-hidden="true">
          <div class="ev-skeleton-thumb"></div>
          <div class="ev-skeleton-line"></div>
          <div class="ev-skeleton-line short"></div>
        </div>
      `).join("");
    }

    function getFilteredItems() {
      const term = searchTerm.trim().toLowerCase();
      return items.filter((v) => {
        const matchesTopic = activeTopic === "all" || v.topic.key === activeTopic;
        const matchesTerm = !term || v.title.toLowerCase().includes(term) || v.topic.label.toLowerCase().includes(term);
        return matchesTopic && matchesTerm;
      });
    }

    function updateNowPlayingUI() {
      const titleEl = document.getElementById("now-playing-title");
      const openYT = document.getElementById("openOnYT");
      const prevBtn = document.getElementById("btn-prev");
      const nextBtn = document.getElementById("btn-next");

      const idx = items.findIndex((v) => v.id === currentId);
      const current = idx >= 0 ? items[idx] : items[0];

      if (current) {
        titleEl.textContent = `Episode ${current.index}: ${current.title}`;
        openYT.href = watchUrl(current.id);
        prevBtn.disabled = idx <= 0;
        nextBtn.disabled = idx < 0 || idx >= items.length - 1;
      } else {
        titleEl.textContent = "Eureka! Physics Playlist";
        openYT.href = PLAYLIST_URL;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      }
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      const countEl = document.getElementById("result-count");
      const list = getFilteredItems();
      const watched = getWatchedSet();

      if (!items.length) {
        countEl.textContent = "Playlist unavailable";
        grid.innerHTML = `
          <div class="ev-empty">
            <p>Could not load the YouTube episode list automatically (your network or content filter may be blocking YouTube embeds).</p>
            <a class="ev-btn ev-btn-primary" href="${PLAYLIST_URL}" target="_blank" rel="noopener">Open Full Playlist on YouTube ↗</a>
          </div>
        `;
        return;
      }

      countEl.textContent = `Showing ${list.length} of ${items.length} episodes`;

      if (!list.length) {
        grid.innerHTML = `
          <div class="ev-empty">
            <p>No episodes match your current search or topic filter.</p>
            <button id="btn-reset-filters" class="ev-btn" type="button">Reset Filters</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map((v) => {
        const isActive = v.id === currentId;
        const isWatched = watched.has(v.id);
        const epNum = String(v.index).padStart(2, "0");
        const safeTitle = escapeHtml(v.title);

        return `
          <article class="ev-card" data-active="${isActive}">
            <button class="ev-thumb-btn" type="button" data-id="${v.id}" aria-label="Play Episode ${v.index}: ${safeTitle}" ${isActive ? 'aria-current="true"' : ""}>
              <img class="ev-thumb-img" src="${thumb(v.id)}" alt="" loading="lazy" decoding="async"/>
              <div class="ev-thumb-scrim" aria-hidden="true"></div>
              <span class="ev-ep-badge">EP ${epNum}</span>
              ${isWatched ? '<span class="ev-watched-badge">✓ Watched</span>' : ""}
              <div class="ev-play-badge" aria-hidden="true">
                <span class="ev-play-circle">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="6 4 20 12 6 20 6 4"></polygon>
                  </svg>
                </span>
              </div>
            </button>
            <div class="ev-card-tags">
              <span class="ev-topic-tag">${escapeHtml(v.topic.label)}</span>
              ${isActive ? '<span class="ev-playing-tag">Playing</span>' : ""}
            </div>
            <h3 class="ev-card-title">${safeTitle}</h3>
            <div class="ev-card-footer">
              <button class="ev-watch-link" type="button" data-id="${v.id}">
                ${isActive ? "Restart Episode" : "Play in Theater"}
              </button>
              <a class="ev-yt-link" href="${watchUrl(v.id)}" target="_blank" rel="noopener" aria-label="Open ${safeTitle} on YouTube">
                YouTube ↗
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function playEpisode(id, shouldScroll = true) {
      if (!id) return;
      currentId = id;
      markWatched(id);
      if (player && typeof player.loadVideoById === "function") {
        player.loadVideoById(id);
      }
      updateNowPlayingUI();
      renderGrid();
      if (shouldScroll) {
        const theater = document.querySelector(".ev-theater");
        if (theater) {
          theater.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }
    }

    async function fetchTitleFor(id) {
      try {
        const url = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("oEmbed error");
        const data = await res.json();
        return data.title || `Eureka! Episode (${id})`;
      } catch {
        return `Eureka! Episode (${id})`;
      }
    }

    function onPlayerReady(event) {
      const iframe = event?.target?.getIframe?.();
      if (iframe && !iframe.title) {
        iframe.title = "Eureka! Physics Video Player";
      }

      const poll = async (attempt = 0) => {
        try {
          const ids = (player.getPlaylist && player.getPlaylist()) || [];
          if (ids.length) {
            clearTimeout(loadTimeout);
            const seen = new Set();
            const uniqueIds = ids.filter((id) => (seen.has(id) ? false : seen.add(id)));
            const titles = await Promise.all(uniqueIds.map(fetchTitleFor));
            items = uniqueIds.map((id, i) => ({
              id,
              index: i + 1,
              title: titles[i],
              topic: classifyTopic(titles[i])
            }));
            currentId = items[0]?.id || null;
            updateNowPlayingUI();
            renderGrid();
            return;
          }
        } catch { }
        if (attempt < 20) {
          setTimeout(() => poll(attempt + 1), 300);
        }
      };
      poll();
    }

    function onPlayerStateChange(event) {
      if (!window.YT || !player) return;
      if (event.data === YT.PlayerState.PLAYING) {
        const videoData = player.getVideoData ? player.getVideoData() : null;
        if (videoData && videoData.video_id && videoData.video_id !== currentId) {
          currentId = videoData.video_id;
          markWatched(currentId);
          updateNowPlayingUI();
          renderGrid();
        }
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        host: "https://www.youtube-nocookie.com",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          playsinline: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    };

    /* Theme Toggle (dark mode default) */
    function initThemeToggle() {
      const btn = document.getElementById("btn-theme-toggle");
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (!btn || !meta) return;

      btn.addEventListener("click", () => {
        const next = meta.content === "light" ? "dark" : "light";
        meta.content = next;
        try {
          localStorage.setItem("color-scheme", next);
        } catch {}
      });

      window.addEventListener("storage", (e) => {
        if (e.key === "color-scheme") {
          meta.content = e.newValue === "light" ? "light" : "dark";
        }
      });
    }

    /* Event Wiring */
    document.addEventListener("click", (e) => {
      const playTrigger = e.target.closest("[data-id]");
      if (playTrigger && playTrigger.dataset.id) {
        playEpisode(playTrigger.dataset.id, true);
        return;
      }

      const pill = e.target.closest(".ev-pill[data-topic]");
      if (pill) {
        activeTopic = pill.dataset.topic;
        document.querySelectorAll(".ev-pill[data-topic]").forEach((p) => {
          p.setAttribute("aria-pressed", String(p === pill));
        });
        renderGrid();
        return;
      }

      if (e.target.closest("#btn-reset-filters")) {
        activeTopic = "all";
        searchTerm = "";
        const input = document.getElementById("q");
        if (input) input.value = "";
        document.querySelectorAll(".ev-pill[data-topic]").forEach((p) => {
          p.setAttribute("aria-pressed", String(p.dataset.topic === "all"));
        });
        renderGrid();
      }
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      const idx = items.findIndex((v) => v.id === currentId);
      if (idx > 0) playEpisode(items[idx - 1].id, false);
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      const idx = items.findIndex((v) => v.id === currentId);
      if (idx >= 0 && idx < items.length - 1) playEpisode(items[idx + 1].id, false);
    });

    document.getElementById("q").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderGrid();
    });

    /* Initialize */
    initThemeToggle();
    renderSkeletons(8);
    loadTimeout = setTimeout(() => {
      if (!items.length) {
        renderGrid();
      }
    }, 6500);
  </script>
</body>

</html>
