<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect width="64" height="64" rx="16" stroke="url(#speedGrad)" stroke-width="2" opacity="0.6" />
  <!-- Speed Vector Arrows -->
  <path d="M12 36 L28 20 L28 28 L44 28 L44 36 L28 36 L28 44 Z" fill="url(#speedGrad)" filter="url(#glow)" transform="translate(4, -4)" />
  <line x1="8" y1="46" x2="38" y2="46" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="14" y1="52" x2="48" y2="52" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
</svg>
