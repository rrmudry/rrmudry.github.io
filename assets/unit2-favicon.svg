<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltSpeedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="voltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d05" />
  <rect width="64" height="64" rx="16" stroke="url(#voltSpeedGrad)" stroke-width="2" opacity="0.8" />
  <!-- Speed Vector Chevron & Motion Streaks -->
  <path d="M14 36 L30 20 L30 28 L46 28 L46 36 L30 36 L30 44 Z" fill="url(#voltSpeedGrad)" filter="url(#voltGlow)" transform="translate(2, -4)" />
  <line x1="8" y1="46" x2="42" y2="46" stroke="#ccff00" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="16" y1="52" x2="52" y2="52" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
</svg>
