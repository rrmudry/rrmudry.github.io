<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="prideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0f172a" stroke="url(#prideGrad)" stroke-width="4" />
  
  <!-- Barcode Vertical Lines -->
  <rect x="22" y="28" width="5" height="34" rx="2.5" fill="#f8fafc" />
  <rect x="31" y="28" width="3" height="34" rx="1.5" fill="#94a3b8" />
  <rect x="38" y="28" width="7" height="34" rx="3.5" fill="#f8fafc" />
  <rect x="49" y="28" width="4" height="34" rx="2" fill="#94a3b8" />
  <rect x="57" y="28" width="8" height="34" rx="4" fill="#f8fafc" />
  <rect x="69" y="28" width="3" height="34" rx="1.5" fill="#94a3b8" />
  <rect x="75" y="28" width="5" height="34" rx="2.5" fill="#f8fafc" />

  <!-- Scanning Laser Beam -->
  <rect x="16" y="43" width="68" height="4" rx="2" fill="url(#scanBeam)" filter="url(#glow)" />

  <!-- PRIDE Star Badge at Bottom -->
  <circle cx="50" cy="74" r="12" fill="url(#prideGrad)" />
  <path d="M50 67 L52.2 71.5 L57.1 72.2 L53.5 75.7 L54.4 80.6 L50 78.3 L45.6 80.6 L46.5 75.7 L42.9 72.2 L47.8 71.5 Z" fill="#ffffff" />
</svg>
